<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/png" href="./icon.png">
  <title>ETA Calculator</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      background: #111827;
      color: #f9fafb;
      font-family: Arial, sans-serif;
    }

    .app {
      position: relative;
      width: 100%;
      max-width: 380px;
      padding: 28px;
      background: #1f2937;
      border: 1px solid #374151;
      border-radius: 16px;
      box-shadow: 0 15px 40px #0003;
    }

    h1 {
      margin: 0 0 8px;
      font-size: 26px;
    }

    .subtitle {
      margin: 0 0 24px;
      color: #9ca3af;
      font-size: 14px;
    }

    label {
      display: block;
      margin-bottom: 8px;
      font-size: 14px;
      font-weight: bold;
    }

    .field {
      position: relative;
    }

    input {
      width: 100%;
      padding: 14px 46px 14px 14px;
      border: 1px solid #4b5563;
      border-radius: 9px;
      background: #111827;
      color: white;
      font-size: 18px;
      outline: none;
    }

    input[type=number] {
      -moz-appearance: textfield;
      appearance: textfield;
    }

    input[type=number]::-webkit-inner-spin-button,
    input[type=number]::-webkit-outer-spin-button {
      -webkit-appearance: none;
      margin: 0;
    }

    input:focus {
      border-color: #60a5fa;
    }

    #clearBtn {
      position: absolute;
      right: 8px;
      top: 50%;
      transform: translateY(-50%);
      width: 30px;
      height: 30px;
      margin: 0;
      padding: 0;
      border-radius: 50%;
      background: #374151;
      color: #d1d5db;
      font-size: 16px;
      line-height: 1;
      display: none;
    }

    #clearBtn.show {
      display: block;
    }

    #clearBtn:hover:not(:disabled) {
      background: #4b5563;
    }

    .speed {
      margin-top: 12px;
      color: #9ca3af;
      font-size: 13px;
    }

    .result {
      margin-top: 22px;
      padding: 18px;
      border-radius: 10px;
      background: #111827;
      text-align: center;
    }

    .result-label {
      margin-bottom: 8px;
      color: #9ca3af;
      font-size: 13px;
    }

    #eta {
      font-size: 28px;
      font-weight: bold;
      letter-spacing: 1px;
    }

    button {
      width: 100%;
      margin-top: 14px;
      padding: 14px;
      border: none;
      border-radius: 9px;
      background: #059669;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover:not(:disabled) {
      background: #047857;
    }

    button:disabled {
      opacity: 0.45;
      cursor: not-allowed;
    }

    #message {
      min-height: 18px;
      margin-top: 12px;
      color: #34d399;
      font-size: 13px;
    }

    /* Settings */
    #settingsBtn {
      position: absolute;
      top: 18px;
      right: 18px;
      width: 36px;
      height: 36px;
      margin: 0;
      padding: 0;
      border-radius: 50%;
      background: #374151;
      color: #d1d5db;
      font-size: 18px;
      line-height: 1;
    }

    #settingsBtn:hover:not(:disabled) {
      background: #4b5563;
    }

    #settingsPanel {
      display: none;
      margin-bottom: 22px;
      padding: 16px;
      border: 1px solid #374151;
      border-radius: 10px;
      background: #111827;
    }

    #settingsPanel.open {
      display: block;
    }

    #settingsPanel input {
      padding: 12px 14px;
    }

    #saveSpeedBtn {
      margin-top: 12px;
      padding: 11px;
      font-size: 14px;
    }

    #settingsMsg {
      min-height: 18px;
      margin-top: 10px;
      color: #f87171;
      font-size: 13px;
    }
  </style>
</head>

<body>
  <main class="app">
    <button id="settingsBtn" type="button" aria-label="Settings" aria-expanded="false">⚙</button>

    <h1>ETA Calculator</h1>
    <p class="subtitle">Arrival time calculated automatically at <span class="speedVal"></span> mph.</p>

    <section id="settingsPanel">
      <label for="speedInput">Speed (mph)</label>
      <input id="speedInput" type="number" min="0" step="any">
      <button id="saveSpeedBtn" type="button">Save</button>
      <div id="settingsMsg"></div>
    </section>

    <label for="miles">Distance (miles)</label>
    <div class="field">
      <input id="miles" type="number" min="0" step="any" placeholder="Enter miles" autofocus>
      <button id="clearBtn" type="button" aria-label="Clear miles">✕</button>
    </div>

    <div class="speed">Fixed speed: <span class="speedVal"></span> mph</div>

    <section class="result" aria-live="polite">
      <div class="result-label">Estimated arrival</div>
      <div id="eta">--/-- --:--</div>

      <button id="copyBtn" type="button" disabled>Copy ETA</button>

      <div id="message"></div>
    </section>
  </main>

  <script>
    const DEFAULT_SPEED = 57;
    const STORAGE_KEY = "etaSpeedMph";

    const milesInput = document.getElementById("miles");
    const etaDisplay = document.getElementById("eta");
    const copyBtn = document.getElementById("copyBtn");
    const clearBtn = document.getElementById("clearBtn");
    const message = document.getElementById("message");
    const settingsBtn = document.getElementById("settingsBtn");
    const settingsPanel = document.getElementById("settingsPanel");
    const speedInput = document.getElementById("speedInput");
    const saveSpeedBtn = document.getElementById("saveSpeedBtn");
    const settingsMsg = document.getElementById("settingsMsg");

    let etaText = "";
    let speed = loadSpeed();

    function loadSpeed() {
      try {
        const v = Number(localStorage.getItem(STORAGE_KEY));
        if (Number.isFinite(v) && v > 0) return v;
      } catch (e) { }
      return DEFAULT_SPEED;
    }

    function saveSpeed(v) {
      try {
        if (v === DEFAULT_SPEED) localStorage.removeItem(STORAGE_KEY);
        else localStorage.setItem(STORAGE_KEY, String(v));
      } catch (e) { }
    }

    function renderSpeed() {
      document.querySelectorAll(".speedVal").forEach(el => el.textContent = speed);
    }

    function formatETA(date) {
      const pad = n => String(n).padStart(2, "0");
      return pad(date.getMonth() + 1) + "/" + pad(date.getDate()) + " " +
        pad(date.getHours()) + ":" + pad(date.getMinutes());
    }

    function reset(msg) {
      etaText = "";
      etaDisplay.textContent = "--/-- --:--";
      copyBtn.disabled = true;
      message.textContent = msg || "";
    }

    function calculateETA() {
      const value = milesInput.value.trim();
      message.textContent = "";
      clearBtn.classList.toggle("show", value !== "");

      if (value === "") return reset();

      const miles = Number(value);
      if (!Number.isFinite(miles) || miles < 0) return reset("Enter a valid distance.");

      const arrival = new Date(Date.now() + (miles / speed) * 3600 * 1000);
      etaText = formatETA(arrival);
      etaDisplay.textContent = etaText;
      copyBtn.disabled = false;
    }

    milesInput.addEventListener("input", calculateETA);

    // Clear the miles field
    clearBtn.addEventListener("click", function () {
      milesInput.value = "";
      calculateETA();
      milesInput.focus();
    });

    // Copy ETA (field is kept)
    copyBtn.addEventListener("click", async function () {
      if (!etaText) return;
      try {
        await navigator.clipboard.writeText(etaText);
        message.textContent = "ETA copied!";
      } catch (error) {
        message.textContent = "Copy failed. Try using HTTPS or localhost.";
      }
    });

    /* ---------- Settings ---------- */
    settingsBtn.addEventListener("click", function () {
      const open = settingsPanel.classList.toggle("open");
      settingsBtn.setAttribute("aria-expanded", open);
      settingsMsg.textContent = "";
      if (open) {
        speedInput.value = speed;
        speedInput.focus();
      }
    });

    function applySpeed(v) {
      speed = v;
      saveSpeed(v);
      renderSpeed();
      calculateETA();
      speedInput.value = v;
    }

    saveSpeedBtn.addEventListener("click", function () {
      const v = Number(speedInput.value);
      if (speedInput.value.trim() === "" || !Number.isFinite(v) || v <= 0) {
        settingsMsg.textContent = "Enter a speed greater than 0.";
        return;
      }
      settingsMsg.textContent = "";
      applySpeed(v);
      milesInput.value = "";
      calculateETA();
      settingsPanel.classList.remove("open");
      settingsBtn.setAttribute("aria-expanded", "false");
    });

    speedInput.addEventListener("keydown", function (e) {
      if (e.key === "Enter") saveSpeedBtn.click();
    });

    renderSpeed();
  </script>
</body>

</html>
