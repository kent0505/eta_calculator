<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/png" href="./icon.png">
  <title>ETA Calculator</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      background: #111827;
      color: #f9fafb;
      font-family: Arial, sans-serif;
    }

    /* Autumn leaves layer (disabled) */
    #leaves {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 0;
    }


    /* Snow layer */
    #snow {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 0;
    }

    .app {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 380px;
      padding: 28px;
      background: #1f2937;
      border: 1px solid #374151;
      border-radius: 16px;
      box-shadow: 0 15px 40px #0003;
    }

    h1 {
      margin: 0 0 8px;
      font-size: 26px;
    }

    .subtitle {
      margin: 0 0 24px;
      color: #9ca3af;
      font-size: 14px;
    }

    label {
      display: block;
      margin-bottom: 8px;
      font-size: 14px;
      font-weight: bold;
    }

    .field {
      position: relative;
    }

    input {
      width: 100%;
      padding: 14px 46px 14px 14px;
      border: 1px solid #4b5563;
      border-radius: 9px;
      background: #111827;
      color: white;
      font-size: 18px;
      outline: none;
    }

    input[type=number] {
      -moz-appearance: textfield;
      appearance: textfield;
    }

    input[type=number]::-webkit-inner-spin-button,
    input[type=number]::-webkit-outer-spin-button {
      -webkit-appearance: none;
      margin: 0;
    }

    input:focus {
      border-color: #60a5fa;
    }

    #clearBtn {
      position: absolute;
      right: 8px;
      top: 50%;
      transform: translateY(-50%);
      width: 30px;
      height: 30px;
      margin: 0;
      padding: 0;
      border-radius: 50%;
      background: #374151;
      color: #d1d5db;
      font-size: 16px;
      line-height: 1;
      display: none;
    }

    #clearBtn.show {
      display: block;
    }

    #clearBtn:hover:not(:disabled) {
      background: #4b5563;
    }

    .speed {
      margin-top: 12px;
      color: #9ca3af;
      font-size: 13px;
    }

    .result {
      margin-top: 22px;
      padding: 18px;
      border-radius: 10px;
      background: #111827;
      text-align: center;
    }

    .result-label {
      margin-bottom: 8px;
      color: #9ca3af;
      font-size: 13px;
    }

    #eta {
      font-size: 28px;
      font-weight: bold;
      letter-spacing: 1px;
    }

    button {
      width: 100%;
      margin-top: 14px;
      padding: 14px;
      border: none;
      border-radius: 9px;
      background: #059669;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover:not(:disabled) {
      background: #047857;
    }

    button:disabled {
      opacity: 0.45;
      cursor: not-allowed;
    }

    #message {
      min-height: 18px;
      margin-top: 12px;
      color: #34d399;
      font-size: 13px;
    }

    /* Settings */
    #settingsBtn {
      position: absolute;
      top: 18px;
      right: 18px;
      width: 36px;
      height: 36px;
      margin: 0;
      padding: 0;
      border-radius: 50%;
      background: #374151;
      color: #d1d5db;
      font-size: 18px;
      line-height: 1;
    }

    #settingsBtn:hover:not(:disabled) {
      background: #4b5563;
    }

    #settingsPanel {
      display: none;
      margin-bottom: 22px;
      padding: 16px;
      border: 1px solid #374151;
      border-radius: 10px;
      background: #111827;
    }

    #settingsPanel.open {
      display: block;
    }

    #settingsPanel input {
      padding: 12px 14px;
    }

    #saveSpeedBtn {
      margin-top: 12px;
      padding: 11px;
      font-size: 14px;
    }

    #settingsMsg {
      min-height: 18px;
      margin-top: 10px;
      color: #f87171;
      font-size: 13px;
    }
  </style>
</head>

<body>
  <!-- Autumn leaves (disabled) -->
  <canvas id="leaves" aria-hidden="true"></canvas>

  <!-- <canvas id="snow" aria-hidden="true"></canvas> -->

  <main class="app">
    <button id="settingsBtn" type="button" aria-label="Settings" aria-expanded="false">⚙</button>

    <h1>ETA Calculator</h1>
    <p class="subtitle">Arrival time calculated automatically at <span class="speedVal"></span> mph.</p>

    <section id="settingsPanel">
      <label for="speedInput">Speed (mph)</label>
      <input id="speedInput" type="number" min="0" step="any">
      <button id="saveSpeedBtn" type="button">Save</button>
      <div id="settingsMsg"></div>
    </section>

    <label for="miles">Distance (miles)</label>
    <div class="field">
      <input id="miles" type="number" min="0" step="any" placeholder="Enter miles" autofocus>
      <button id="clearBtn" type="button" aria-label="Clear miles">✕</button>
    </div>

    <div class="speed">Fixed speed: <span class="speedVal"></span> mph</div>

    <section class="result" aria-live="polite">
      <div class="result-label">Estimated arrival</div>
      <div id="eta">--/-- --:--</div>

      <button id="copyBtn" type="button" disabled>Copy ETA</button>

      <div id="message"></div>
    </section>
  </main>

  <script>
    const DEFAULT_SPEED = 57;
    const STORAGE_KEY = "etaSpeedMph";

    const milesInput = document.getElementById("miles");
    const etaDisplay = document.getElementById("eta");
    const copyBtn = document.getElementById("copyBtn");
    const clearBtn = document.getElementById("clearBtn");
    const message = document.getElementById("message");
    const settingsBtn = document.getElementById("settingsBtn");
    const settingsPanel = document.getElementById("settingsPanel");
    const speedInput = document.getElementById("speedInput");
    const saveSpeedBtn = document.getElementById("saveSpeedBtn");
    const settingsMsg = document.getElementById("settingsMsg");

    let etaText = "";
    let speed = loadSpeed();

    function loadSpeed() {
      try {
        const v = Number(localStorage.getItem(STORAGE_KEY));
        if (Number.isFinite(v) && v > 0) return v;
      } catch (e) { }
      return DEFAULT_SPEED;
    }

    function saveSpeed(v) {
      try {
        if (v === DEFAULT_SPEED) localStorage.removeItem(STORAGE_KEY);
        else localStorage.setItem(STORAGE_KEY, String(v));
      } catch (e) { }
    }

    function renderSpeed() {
      document.querySelectorAll(".speedVal").forEach(el => el.textContent = speed);
    }

    function formatETA(date) {
      const pad = n => String(n).padStart(2, "0");
      return pad(date.getMonth() + 1) + "/" + pad(date.getDate()) + " " +
        pad(date.getHours()) + ":" + pad(date.getMinutes());
    }

    function reset(msg) {
      etaText = "";
      etaDisplay.textContent = "--/-- --:--";
      copyBtn.disabled = true;
      message.textContent = msg || "";
    }

    function calculateETA() {
      const value = milesInput.value.trim();
      message.textContent = "";
      clearBtn.classList.toggle("show", value !== "");

      if (value === "") return reset();

      const miles = Number(value);
      if (!Number.isFinite(miles) || miles < 0) return reset("Enter a valid distance.");

      const arrival = new Date(Date.now() + (miles / speed) * 3600 * 1000);
      etaText = formatETA(arrival);
      etaDisplay.textContent = etaText;
      copyBtn.disabled = false;
    }

    milesInput.addEventListener("input", calculateETA);

    // Clear the miles field
    clearBtn.addEventListener("click", function () {
      milesInput.value = "";
      calculateETA();
      milesInput.focus();
    });

    // Copy ETA (field is kept)
    copyBtn.addEventListener("click", async function () {
      if (!etaText) return;
      try {
        await navigator.clipboard.writeText(etaText);
        message.textContent = "ETA copied!";
      } catch (error) {
        message.textContent = "Copy failed. Try using HTTPS or localhost.";
      }
    });

    /* ---------- Settings ---------- */
    settingsBtn.addEventListener("click", function () {
      const open = settingsPanel.classList.toggle("open");
      settingsBtn.setAttribute("aria-expanded", open);
      settingsMsg.textContent = "";
      if (open) {
        speedInput.value = speed;
        speedInput.focus();
      }
    });

    function applySpeed(v) {
      speed = v;
      saveSpeed(v);
      renderSpeed();
      calculateETA();
      speedInput.value = v;
    }

    saveSpeedBtn.addEventListener("click", function () {
      const v = Number(speedInput.value);
      if (speedInput.value.trim() === "" || !Number.isFinite(v) || v <= 0) {
        settingsMsg.textContent = "Enter a speed greater than 0.";
        return;
      }
      settingsMsg.textContent = "";
      applySpeed(v);
      milesInput.value = "";
      calculateETA();
      settingsPanel.classList.remove("open");
      settingsBtn.setAttribute("aria-expanded", "false");
    });

    speedInput.addEventListener("keydown", function (e) {
      if (e.key === "Enter") saveSpeedBtn.click();
    });

    renderSpeed();

    (function () {
      const canvas = document.getElementById("leaves");
      const ctx = canvas.getContext("2d");
      const reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)");
      const COLORS = ["#c2410c", "#ea580c", "#d97706", "#b45309", "#dc2626", "#ca8a04", "#92400e", "#9a3412"];

      let W = 0, H = 0, leaves = [], last = 0, rafId = null;

      function resize() {
        const dpr = Math.min(window.devicePixelRatio || 1, 2);
        W = window.innerWidth;
        H = window.innerHeight;
        canvas.width = W * dpr;
        canvas.height = H * dpr;
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

        // Scale leaf count with screen width
        const target = Math.round(Math.min(60, Math.max(18, W / 28)));
        while (leaves.length < target) leaves.push(makeLeaf(true));
        if (leaves.length > target) leaves.length = target;
      }

      function makeLeaf(randomY) {
        const size = 7 + Math.random() * 13;
        return {
          x: Math.random() * W,
          y: randomY ? Math.random() * H : -size * 2,
          size: size,
          vy: 28 + size * 2.2 + Math.random() * 20,   // px/sec, bigger = faster
          swayAmp: 18 + Math.random() * 38,
          swayFreq: 0.5 + Math.random() * 0.9,
          phase: Math.random() * Math.PI * 2,
          rot: Math.random() * Math.PI * 2,
          vr: (Math.random() - 0.5) * 1.6,
          flip: Math.random() * Math.PI * 2,
          vflip: 1 + Math.random() * 2,
          color: COLORS[(Math.random() * COLORS.length) | 0],
          alpha: 0.5 + Math.random() * 0.4,
          t: 0,
          baseX: 0
        };
      }

      function drawLeaf(l) {
        const s = l.size;
        ctx.save();
        ctx.translate(l.x, l.y);
        ctx.rotate(l.rot);
        ctx.scale(Math.max(0.25, Math.abs(Math.cos(l.flip))), 1); // tumbling look
        ctx.globalAlpha = l.alpha;

        // blade
        ctx.beginPath();
        ctx.moveTo(0, -s);
        ctx.bezierCurveTo(s * 0.95, -s * 0.45, s * 0.8, s * 0.55, 0, s);
        ctx.bezierCurveTo(-s * 0.8, s * 0.55, -s * 0.95, -s * 0.45, 0, -s);
        ctx.fillStyle = l.color;
        ctx.fill();

        // midrib + stem
        ctx.beginPath();
        ctx.moveTo(0, -s * 0.9);
        ctx.lineTo(0, s * 1.25);
        ctx.strokeStyle = "rgba(0,0,0,0.3)";
        ctx.lineWidth = Math.max(0.8, s * 0.08);
        ctx.stroke();

        ctx.restore();
      }

      function frame(now) {
        const dt = Math.min(0.05, (now - last) / 1000 || 0);
        last = now;
        ctx.clearRect(0, 0, W, H);

        for (let i = 0; i < leaves.length; i++) {
          const l = leaves[i];
          l.t += dt;
          l.y += l.vy * dt;
          l.x += Math.cos(l.t * l.swayFreq + l.phase) * l.swayAmp * dt;
          l.rot += l.vr * dt;
          l.flip += l.vflip * dt;

          if (l.y - l.size * 2 > H || l.x < -60 || l.x > W + 60) {
            leaves[i] = makeLeaf(false);
            leaves[i].x = Math.random() * W;
          }
          drawLeaf(l);
        }
        rafId = requestAnimationFrame(frame);
      }

      function start() {
        if (rafId || reduceMotion.matches) return;
        last = performance.now();
        rafId = requestAnimationFrame(frame);
      }

      function stop() {
        if (rafId) cancelAnimationFrame(rafId);
        rafId = null;
      }

      function drawStatic() {
        ctx.clearRect(0, 0, W, H);
        leaves.forEach(drawLeaf);
      }

      window.addEventListener("resize", function () {
        resize();
        if (reduceMotion.matches) drawStatic();
      });

      document.addEventListener("visibilitychange", function () {
        document.hidden ? stop() : start();
      });

      reduceMotion.addEventListener("change", function () {
        if (reduceMotion.matches) { stop(); drawStatic(); } else start();
      });

      resize();
      if (reduceMotion.matches) drawStatic(); else start();
    })();

    /* ---------- Falling snow ---------- */
    (function () {
      const canvas = document.getElementById("snow");
      const ctx = canvas.getContext("2d");
      const reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)");

      let W = 0, H = 0, flakes = [], last = 0, time = 0, rafId = null;

      function resize() {
        const dpr = Math.min(window.devicePixelRatio || 1, 2);
        W = window.innerWidth;
        H = window.innerHeight;
        canvas.width = W * dpr;
        canvas.height = H * dpr;
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

        // Scale flake count with screen width
        const target = Math.round(Math.min(140, Math.max(40, W / 12)));
        while (flakes.length < target) flakes.push(makeFlake(true));
        if (flakes.length > target) flakes.length = target;
      }

      function makeFlake(randomY) {
        const r = 1 + Math.random() * 3.2;
        return {
          x: Math.random() * W,
          y: randomY ? Math.random() * H : -r * 2,
          r: r,
          vy: 18 + r * 13 + Math.random() * 14,   // px/sec, bigger = faster (parallax)
          swayAmp: 8 + Math.random() * 22,
          swayFreq: 0.4 + Math.random() * 0.8,
          phase: Math.random() * Math.PI * 2,
          alpha: 0.4 + Math.random() * 0.5
        };
      }

      function drawFlake(f) {
        ctx.beginPath();
        ctx.arc(f.x, f.y, f.r, 0, Math.PI * 2);
        ctx.fillStyle = "rgba(255,255,255," + f.alpha + ")";
        ctx.fill();
      }

      function frame(now) {
        const dt = Math.min(0.05, (now - last) / 1000 || 0);
        last = now;
        time += dt;
        ctx.clearRect(0, 0, W, H);

        const wind = Math.sin(time * 0.2) * 12; // gentle drifting wind

        for (let i = 0; i < flakes.length; i++) {
          const f = flakes[i];
          f.y += f.vy * dt;
          f.x += (Math.cos(time * f.swayFreq + f.phase) * f.swayAmp + wind) * dt;

          if (f.y - f.r > H || f.x < -20 || f.x > W + 20) {
            flakes[i] = makeFlake(false);
            flakes[i].x = Math.random() * W;
          }
          drawFlake(f);
        }
        rafId = requestAnimationFrame(frame);
      }

      function start() {
        if (rafId || reduceMotion.matches) return;
        last = performance.now();
        rafId = requestAnimationFrame(frame);
      }

      function stop() {
        if (rafId) cancelAnimationFrame(rafId);
        rafId = null;
      }

      function drawStatic() {
        ctx.clearRect(0, 0, W, H);
        flakes.forEach(drawFlake);
      }

      window.addEventListener("resize", function () {
        resize();
        if (reduceMotion.matches) drawStatic();
      });

      document.addEventListener("visibilitychange", function () {
        document.hidden ? stop() : start();
      });

      reduceMotion.addEventListener("change", function () {
        if (reduceMotion.matches) { stop(); drawStatic(); } else start();
      });

      resize();
      if (reduceMotion.matches) drawStatic(); else start();
    })();
  </script>
</body>

</html>
